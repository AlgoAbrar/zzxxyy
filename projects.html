<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>All Projects - Algo Inject</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Rubik:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Complete CSS with all variables */
      :root {
        --brand: #f57c31;
        --brand-light: #ff9b6a;
        --bg-900: #1a1a1a;
        --bg-800: #262a2c;
        --muted: #696969;
        --white: #ffffff;
        --gs-1: #f9fafb;
        --gs-2: #f4f4f6;
        --gs-3: #e5e6eb;
        --gs-4: #d3d5da;
        --gs-5: #9ea3ae;
        --gs-6: #6c727f;
        --gs-7: #4d5461;
        --gs-8: #394150;
        --gs-9: #212936;
        --gs-10: #161d21;
      }

      body {
        background: linear-gradient(180deg, #0b0b0c, #0f1112);
        color: var(--white);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      .font-syne {
        font-family: "Syne", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }
      .font-rubik {
        font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }

      .glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(6px);
        border-radius: 14px;
      }

      .projects-grid {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(3, 1fr);
      }

      @media (max-width: 1024px) {
        .projects-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 640px) {
        .projects-grid {
          grid-template-columns: 1fr;
        }
      }

      .project-card {
        border-radius: 14px;
        overflow: hidden;
        transition: all 0.3s ease;
        background: linear-gradient(180deg, #0b0b0b, #0e0e0e);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .project-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 30px rgba(245, 124, 49, 0.15);
      }

      .project-media {
        height: 240px;
        background: #0a0a0a;
        overflow: hidden;
      }

      .project-buttons {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .project-btn {
        flex: 1;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        text-align: center;
        transition: all 0.3s ease;
        text-decoration: none;
        font-family: "Rubik";
      }

      .github-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--white);
      }

      .github-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .demo-btn {
        background: var(--brand);
        color: #111;
      }

      .demo-btn:hover {
        background: var(--brand-light);
      }

      .filter-btn {
        padding: 8px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--gs-5);
        font-size: 14px;
        transition: all 0.3s ease;
        cursor: pointer;
        margin: 4px;
      }

      .filter-btn.active,
      .filter-btn:hover {
        background: var(--brand);
        color: #111;
        border-color: var(--brand);
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2rem;
        padding: 12px 24px;
        background: rgba(245, 124, 49, 0.1);
        color: var(--brand);
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.3s ease;
        font-family: "Rubik";
      }

      .back-btn:hover {
        background: rgba(245, 124, 49, 0.2);
        gap: 12px;
      }

      .muted {
        color: var(--gs-5);
      }

      /* Loading animation */
      .loading {
        background: linear-gradient(
          90deg,
          #0a0a0a 25%,
          #131313 50%,
          #0a0a0a 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }

      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* Navigation styles */
      nav {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(10px);
        background: rgba(11, 11, 12, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
  </head>
  <body class="antialiased">
    <!-- Navigation will be loaded here -->
    <div id="nav-container"></div>

    <main class="max-w-[1200px] mx-auto px-6 py-12">
      <a href="index.html" class="back-btn">← Back to Home</a>

      <header class="mb-8">
        <h1 class="font-syne text-4xl">All Projects</h1>
        <p class="font-rubik text-lg muted mt-4">
          A collection of my technical projects spanning full-stack development,
          AI solutions, and system architecture.
        </p>
      </header>

      <!-- Project Filters -->
      <div
        class="project-filter flex flex-wrap gap-2 mb-8"
        id="project-filters"
      >
        <button class="filter-btn active" data-filter="all">
          All Projects
        </button>
        <!-- Filters will be auto-generated -->
      </div>

      <!-- Projects Grid - THIS IS WHAT INDEX.HTML LOOKS FOR -->
      <div class="projects-grid" id="projects-grid">
        <!-- Project cards will be loaded here by JavaScript -->
      </div>
    </main>

    <script>
      // Load navigation
      document.addEventListener("DOMContentLoaded", function () {
        fetch("index.html")
          .then((response) => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.text();
          })
          .then((html) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");
            const nav = doc.querySelector("nav");
            if (nav) {
              document.getElementById("nav-container").innerHTML =
                nav.outerHTML;
              // Re-attach mobile menu functionality
              attachMobileMenu();
            }
          })
          .catch((error) => {
            console.error("Error loading navigation:", error);
            // Fallback navigation
            document.getElementById("nav-container").innerHTML = `
              <nav class="flex items-center justify-between py-6 px-6">
                <div class="flex items-center gap-3">
                  <a href="index.html" class="text-lg font-syne tracking-wide">ALGO INJECT</a>
                </div>
                <a href="index.html" class="back-btn">← Back to Home</a>
              </nav>
            `;
          });

        // Project data - this is what index.html will extract
        // Project data - linking to actual project files
        const projects = [
          {
            title: "AlgoFit Gym E-commerce Platform",
            category: "Full-Stack, E-commerce, React, Node.js",
            description:
              "A comprehensive gym equipment e-commerce platform with user authentication, product management, shopping cart, and payment integration.",
            github: "https://github.com/AlgoAbrar/AlgoFit_Frontend",
            demo: "https://algo-fit-frontend.vercel.app/",
            image: "images/project/algofit-gym.png",
            categories: ["full-stack", "e-commerce", "react", "node.js"],
            link: "projects/algofitgym.html",
          },
          {
            title: "Army Training and Academic Monitoring System",
            category: "Full-Stack, Web Application, Java, Spring Boot",
            description:
              "A comprehensive system for managing army training programs and academic progress tracking with role-based access control.",
            github:
              "https://github.com/AlgoAbrar/Army_Training_and_Academic_Monitoring_System",
            demo: "https://army-training-demo.netlify.app",
            image: "images/project/army-training.png",
            categories: [
              "full-stack",
              "web application",
              "java",
              "spring boot",
            ],
            link: "projects/armytraining.html",
          },
          {
            title: "BAUET Campus Management System",
            category: "Full-Stack, Academic, Java, Web Application",
            description:
              "A comprehensive campus management system for educational institutions with student portal, faculty dashboard, and admin panel.",
            github:
              "https://github.com/AlgoAbrar/Modern_Campus_Resource_Management_Backend_Java/tree/main/cms",
            demo: "https://www.figma.com/make/MA4NRcSkUZzMS2djwuQvTa/Campus-Management-Homepage--Community-?node-id=0-1&p=f&fullscreen=1",
            image: "images/project/campus-management.png",
            categories: ["full-stack", "academic", "java", "web application"],
            link: "projects/campusmanagement.html",
          },
        ];

        // Render projects
        const projectsGrid = document.getElementById("projects-grid");
        const allCategories = new Set();

        // Clear loading state
        projectsGrid.innerHTML = "";

        projects.forEach((project) => {
          // Add categories to filter list
          project.categories.forEach((cat) => allCategories.add(cat));

          // Create project card
          const projectCard = document.createElement("div");
          projectCard.className = "project-card";
          projectCard.setAttribute(
            "data-categories",
            project.categories.join(",")
          );

          projectCard.innerHTML = `
  <a href="${project.link}" class="block">
    <div class="project-media">
      ${
        project.image
          ? `<img src="${project.image}" alt="${project.title}" class="w-full h-full object-cover">`
          : '<div class="loading w-full h-full"></div>'
      }
    </div>
    <div class="p-6">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-rubik font-semibold text-lg">${project.title}</div>
          <div class="text-sm muted mt-1">${project.category}</div>
        </div>
        <div class="text-[18px] muted">↗</div>
      </div>
      <p class="mt-3 text-sm muted">${project.description}</p>
      <div class="project-buttons">
        ${
          project.github
            ? `<a href="${project.github}" class="project-btn github-btn" target="_blank" onclick="event.stopPropagation()">GitHub</a>`
            : ""
        }
        ${
          project.demo
            ? `<a href="${project.demo}" class="project-btn demo-btn" target="_blank" onclick="event.stopPropagation()">Live Demo</a>`
            : ""
        }
      </div>
    </div>
  </a>
`;

          projectsGrid.appendChild(projectCard);
        });

        // Generate filter buttons from actual project categories
        allCategories.forEach((category) => {
          const filterBtn = document.createElement("button");
          filterBtn.className = "filter-btn";
          filterBtn.textContent =
            category.charAt(0).toUpperCase() + category.slice(1);
          filterBtn.setAttribute("data-filter", category.toLowerCase());
          document.getElementById("project-filters").appendChild(filterBtn);
        });

        // Add filtering functionality
        const filterButtons = document.querySelectorAll(".filter-btn");
        const projectCards = document.querySelectorAll(".project-card");

        filterButtons.forEach((button) => {
          button.addEventListener("click", function () {
            filterButtons.forEach((btn) => btn.classList.remove("active"));
            this.classList.add("active");

            const filterValue = this.getAttribute("data-filter");

            projectCards.forEach((card) => {
              if (
                filterValue === "all" ||
                card
                  .getAttribute("data-categories")
                  .toLowerCase()
                  .includes(filterValue)
              ) {
                card.style.display = "block";
              } else {
                card.style.display = "none";
              }
            });
          });
        });
      });

      // Mobile menu functionality
      function attachMobileMenu() {
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const closeMenuBtn = document.getElementById("close-menu");

        if (mobileMenuBtn && mobileMenu) {
          mobileMenuBtn.addEventListener("click", () => {
            mobileMenu.classList.add("active");
            document.body.style.overflow = "hidden";
          });
        }

        if (closeMenuBtn && mobileMenu) {
          closeMenuBtn.addEventListener("click", () => {
            mobileMenu.classList.remove("active");
            document.body.style.overflow = "";
          });
        }

        const mobileLinks = mobileMenu?.querySelectorAll("a");
        mobileLinks?.forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.classList.remove("active");
            document.body.style.overflow = "";
          });
        });
      }
    </script>
  </body>
</html>
